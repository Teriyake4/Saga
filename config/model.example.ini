; One model profile per file. Only explicit fields patch the TOML/default Config.
[model]
; Planned runtime input is a supported-profile GGUF; reader/conversion/loading are not implemented.
; This is a path example only; no extension or profile validation is performed.
; Relative paths resolve from THIS file, not the shell working directory.
model = ../models/qwen3_8_27b_gsq3.gguf
alias = qwen3.8-27b-gsq3
runtime = qwen3_8_27b
backend = cuda
device = 0
tuning = auto
ctx-size = 8192
kv-capacity = auto
cache-type-k = int8_g64
cache-type-v = int8_g64
prefill-chunk = 512
speculation = off
max-draft-tokens = 3
vision-enabled = false
vision-device = cpu
vision-cpu-threads = 4
max-images-per-request = 4
