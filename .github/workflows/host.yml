name: Host foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify native Windows build and install
        shell: pwsh
        run: .\tools\windows\verify.ps1 -Configuration '${{ matrix.configuration }}'
      - name: Retain Windows build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.configuration }}-evidence
          path: build/windows-evidence/
          if-no-files-found: warn
  macos:
    strategy:
      fail-fast: false
      matrix:
        preset: [host-debug, host-release, host-sanitized, host-thread-sanitized]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
  # Linux is an optional manual procedure; no Linux job is required here.
  # CUDA qualification is separate: native Linux and Windows on an original RTX 4080.
